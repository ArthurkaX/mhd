[package]
name = "mhd-daemon"
version = "0.1.0"
edition = "2024"

[features]
default = []
blackbox = []

[[bin]]
name = "mhd"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
serde_json = "1.0"
sha1 = "0.10"
base64 = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
embed-resource = "3.0"
