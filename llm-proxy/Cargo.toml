[package]
name = "mhd-llm-proxy"
version = "0.2.0"
edition = "2024"
license.workspace = true
description = "Dynamic LLM proxy — intercepts Claude Code requests and routes them to Anthropic, OpenCode, or local models"

[lib]
name = "llm_proxy"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
anyhow = "1.0"
dirs = "5"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
