[package]
name = "mhd-llm-proxy"
version = "0.8.0"
edition = "2024"
license.workspace = true
description = "Dynamic LLM proxy — intercepts Claude Code requests and routes them to Anthropic, OpenCode, or local models"

[lib]
name = "llm_proxy"
path = "src/lib.rs"

[[bin]]
name = "spend_report"
path = "src/bin/spend_report.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "prefix_check"
path = "src/bin/prefix_check.rs"

[[bin]]
name = "cache_bench"
path = "src/bin/cache_bench.rs"

[[bin]]
name = "tune_check"
path = "src/bin/tune_check.rs"

[[bin]]
name = "tune3_check"
path = "src/bin/tune3_check.rs"

[[bin]]
name = "dump_body"
path = "src/bin/dump_body.rs"

[[bin]]
name = "read_lifecycle_probe"
path = "src/bin/read_lifecycle_probe.rs"

[[bin]]
name = "content_mix"
path = "src/bin/content_mix.rs"

[[bin]]
name = "codex_wire_probe"
path = "src/bin/codex_wire_probe.rs"

[[bin]]
name = "corpus_migrate"
path = "src/bin/corpus_migrate.rs"

[[bin]]
name = "codex_trim_replay"
path = "src/bin/codex_trim_replay.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
reqwest = { workspace = true, features = ["stream", "blocking"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
anyhow = "1.0"
base64 = "0.22"
dirs.workspace = true
tracing = "0.1"
rusqlite.workspace = true
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
