[package]
name = "mhd-llm-proxy"
version = "0.6.1"
edition = "2024"
license.workspace = true
description = "Dynamic LLM proxy — intercepts Claude Code requests and routes them to Anthropic, OpenCode, or local models"

[lib]
name = "llm_proxy"
path = "src/lib.rs"

[[bin]]
name = "spend_report"
path = "src/bin/spend_report.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = ">=1.0.150"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
anyhow = "1.0"
base64 = "0.22"
dirs = "5"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
llmtrim-core = { git = "https://github.com/fkiene/llmtrim", rev = "d49742885669e27eff91f6ff7ed0e8625a9dc295", default-features = false }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
