[package]
name = "mhd-ui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "mhd-tray"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }
